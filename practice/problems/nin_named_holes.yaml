kind: clean_named
request: My bracket mounts through the four base holes; the center hole takes 5000 N pulling straight
  up away from the base. Steel. I want to try a different size for all four mounting holes together, nothing
  else.
hidden_facts: 'The four holes in the base plate are the mounting holes; they are bolted down. The center
  hole in the upright lug is the loaded hole: 5000 N pulling straight up (+y), away from the mounting
  holes. Material: structural steel. Goal: lighter. Safety factor: default is fine. You only want the
  mounting-hole size changed (all four together).'
