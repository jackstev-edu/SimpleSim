id: lbr_units
part: examples/l_bracket.scdocx
kind: units
request: My L bracket is screwed to a wall by its tall leg and has to hold a 50 kg weight hanging from
  the end of the short leg. Can you make it lighter?
hidden_facts: 'The back of the tall leg (the flat face at x = 0) is bolted flat to a wall. The end face
  of the short leg has a 50 kg mass hanging from it (gravity, straight down). Material: structural steel.
  Goal: make it as light as possible. Safety factor: you did not think about it; the assistant may use
  its default.'
