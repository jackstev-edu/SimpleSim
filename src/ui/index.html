<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleSim demo shell</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23121212'/%3E%3Cdefs%3E%3ClinearGradient id='ssg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235fe0cb'/%3E%3Cstop offset='1' stop-color='%232f8fef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='none' stroke-linecap='round' stroke-width='2.7' transform='skewX(-9) translate(2.3 0)'%3E%3Cpath d='M10 5C10 2.2 2 2.2 2 6.6C2 10.8 10 9.4 10 13.8C10 18 2 18 2 15.2' transform='translate(3.2 1.9)' stroke='url(%23ssg)'/%3E%3Cpath d='M10 5C10 2.2 2 2.2 2 6.6C2 10.8 10 9.4 10 13.8C10 18 2 18 2 15.2' transform='translate(10.3 1.9)' stroke='%23121212' stroke-width='5.2'/%3E%3Cpath d='M10 5C10 2.2 2 2.2 2 6.6C2 10.8 10 9.4 10 13.8C10 18 2 18 2 15.2' transform='translate(10.3 1.9)' stroke='%23fff'/%3E%3C/g%3E%3Ccircle cx='21.3' cy='4.7' r='1.5' fill='%23f5a21f'/%3E%3C/svg%3E">
<style>
  :root {
    --bar: #121212; --rib: #262626; --win: #1b1b1b; --line: #3e3e3e; --text: #efefef; --muted: #a0a0a0;
    --blue: #3aa0ff; --sel: #1d5c9e; --navy: #0f2a68; --green: #27b535; --amber: #f2a531; --red: #f2665f;
    --purple: #a850d8; --orange: #f5a21f; --pred: #6db6ff; --fake: #b9b9b9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: var(--text); font: 13px/1.3 "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 30px 27px auto minmax(0, 1fr) 23px; min-width: 1000px; overflow: hidden; user-select: none;
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  svg.ic { flex: none; display: block; }

  /* Application title bar */
  .titlebar { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 6px; background: var(--bar); white-space: nowrap; }
  .titlebar .doc { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .titlebar .grow { flex: 1; }
  .search { display: flex; align-items: center; gap: 6px; width: 150px; height: 22px; padding: 0 6px; border: 1px solid #2f6fb5; background: #1c1c1c; color: var(--muted); }
  .signin { display: flex; align-items: center; gap: 6px; color: #d8d8d8; }
  .wc { display: flex; gap: 16px; align-items: center; }

  /* Ribbon tab strip with slanted dividers */
  .tabrow { display: flex; align-items: stretch; background: var(--bar); padding-left: 6px; isolation: isolate; min-width: 0; }
  .burger { width: 22px; align-self: center; height: 14px; border-top: 2px solid #eee; border-bottom: 2px solid #eee; position: relative; margin-right: 14px; flex: none; }
  .burger::after { content: ""; position: absolute; left: 0; right: 0; top: 4px; border-top: 2px solid #eee; }
  .tab { position: relative; display: flex; align-items: center; gap: 5px; padding: 0 16px 0 14px; font-variant: small-caps; font-size: 15px; letter-spacing: .03em; color: #e2e2e2; white-space: nowrap; }
  .tab::before { content: ""; position: absolute; inset: 0; transform: skewX(-24deg); border-left: 1px solid #5a5a5a; z-index: -1; }
  .tab.on::before { background: var(--rib); border-left-color: #777; border-right: 1px solid #777; }
  .badge { margin: 3px 10px 3px auto; align-self: center; flex: none; border: 1px solid var(--amber); color: var(--amber); padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; }

  /* Ribbon */
  .ribbon { display: flex; background: var(--rib); border-bottom: 1px solid #000; height: 97px; min-width: 0; }
  .chev { flex: none; width: 18px; background: none; border: 0; cursor: pointer; font-size: 17px; font-weight: 700; padding: 0; }
  .groups { display: flex; flex: 1; overflow: hidden; scroll-behavior: smooth; min-width: 0; }
  .group { display: flex; flex-direction: column; flex: none; padding: 5px 4px 2px; border-right: 1px solid #111; box-shadow: 1px 0 0 #3a3a3a; }
  .items { display: flex; flex: 1; align-items: flex-start; }
  .gname { text-align: center; font-variant: small-caps; font-size: 13.5px; letter-spacing: .04em; color: #e0e0e0; line-height: 15px; }
  .rb { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 1px 4px 0; background: none; border: 0; border-radius: 2px; white-space: nowrap; height: 68px; }
  .rb .car { margin-top: 3px; }
  .car { display: block; width: 0; height: 0; border: 4.5px solid transparent; border-top: 5px solid currentColor; border-bottom: 0; }
  .stack { display: flex; flex-direction: column; padding-top: 1px; }
  .rs { display: flex; align-items: center; gap: 6px; height: 23px; padding: 0 4px; background: none; border: 0; border-radius: 2px; white-space: nowrap; }
  .rs .car { margin-left: auto; }
  .rs span { margin-right: 3px; }
  .dim { color: #7f7f7f; } .dim svg.ic { opacity: .4; filter: grayscale(1); }
  .live { cursor: pointer; } .live:hover, .rb.open { background: #3a3a3a; }
  .menu { position: fixed; z-index: 30; background: #1e1e1e; border: 1px solid #5a5a5a; padding: 3px 0; box-shadow: 0 6px 20px #000c; }
  .menu[hidden] { display: none; }
  .menu div { display: flex; align-items: center; gap: 8px; padding: 3px 14px 3px 8px; white-space: nowrap; }
  .menu div:hover { background: var(--sel); }

  /* Viewport: everything below the ribbon floats over the 3D scene */
  .vp { position: relative; overflow: hidden; min-height: 0; background: radial-gradient(ellipse at 50% 42%, #353535 0%, #282828 45%, #141414 100%); }
  .scenebox { position: absolute; left: 300px; right: 376px; top: 0; bottom: 390px; }
  .vp.agent-off .scenebox { right: 8px; } .vp.var-off .scenebox { bottom: 110px; }
  .scenebox svg { width: 100%; height: 100%; overflow: visible; }
  .hud { position: absolute; text-shadow: 0 1px 2px #000; }

  .tree { left: 6px; top: 4px; font-size: 13.5px; white-space: nowrap; }
  .thead { display: flex; align-items: center; gap: 6px; height: 24px; margin-bottom: 2px; }
  .thead .wheel { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(#f33, #fc3, #3c3, #3cf, #36f, #c3f, #f33); box-shadow: inset 0 0 0 3.5px transparent; -webkit-mask: radial-gradient(circle, transparent 3px, #000 3.5px); mask: radial-gradient(circle, transparent 3px, #000 3.5px); }
  .thead .cap { color: var(--muted); margin-left: 2px; }
  .thead .docname { color: var(--blue); font-weight: 700; }
  .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree > ul { margin-left: 18px; }
  .tree ul ul { margin-left: 8px; }
  .tree ul ul li { position: relative; padding-left: 26px; }
  .tree ul ul li::before { content: ""; position: absolute; left: 0; top: 10px; width: 22px; border-top: 1px solid #9a9a9a; }
  .tree ul ul li::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid #9a9a9a; }
  .tree ul ul li:last-child::after { bottom: auto; height: 10px; }
  .node { display: flex; align-items: center; gap: 6px; height: 20px; }
  .node.head { gap: 5px; }
  .node.head::before { content: ""; border: 5px solid transparent; border-top: 6px solid var(--blue); border-bottom: 0; }
  .vbox { border: 1px solid #2f7fd0; background: #141414; padding: 0 6px; line-height: 17px; margin-left: 3px; text-shadow: none; }
  .vplain { color: #c4c4c4; margin-left: 3px; }
  .node.bind > span:first-of-type, .node.bind .vbox { color: var(--amber); border-color: var(--amber); }

  .readout { right: 384px; top: 6px; text-align: right; font-size: 13.5px; }
  .vp.agent-off .readout { right: 12px; }
  .readout .ricons { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 4px; }
  .readout .rname b { color: var(--blue); }
  .readout .rchips { margin: 2px 0 4px; display: flex; gap: 5px; justify-content: flex-end; }
  .readout table { margin-left: auto; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .readout td { padding: 0 0 0 12px; text-align: right; }
  .readout td:first-child { color: #c4c4c4; }
  .readout .und { border-bottom: 2px solid var(--blue); color: var(--blue); font-weight: 600; }

  .handle { position: absolute; left: 0; top: 58%; width: 17px; height: 44px; padding: 0; border: 0; background: #ececec; border-radius: 0 10px 10px 0; cursor: pointer; }
  .handle::before { content: ""; position: absolute; left: 4px; top: 13px; width: 2px; height: 18px; background: #333; box-shadow: 4px 0 0 #333, 8px 0 0 #333; }
  .viewwheel { position: absolute; left: -8px; bottom: -12px; width: 138px; height: 138px; }
  .toolwheel { position: absolute; right: -8px; bottom: -12px; width: 146px; height: 146px; }
  .stage { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .stage .scaret { border: 6px solid transparent; border-bottom: 7px solid #eee; border-top: 0; }
  .stage .sname { font-size: 13.5px; line-height: 17px; }
  .stage svg { display: block; }
  .stage [data-tab] { cursor: pointer; }
  .explore { display: flex; align-items: center; gap: 6px; color: #bbb; font-size: 18px; line-height: 22px; }
  .explore b { display: block; width: 150px; height: 23px; background: var(--orange); color: #111; font-weight: 400; font-variant: small-caps; font-size: 16px; letter-spacing: .05em; text-align: center; clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%); }

  /* Floating windows nested in the viewport */
  .win { position: absolute; display: flex; flex-direction: column; background: var(--win); border: 1px solid #505050; box-shadow: 0 10px 30px #000b; min-width: 260px; min-height: 130px; z-index: 5; }
  .win[hidden] { display: none; }
  .win.max { left: 8px !important; top: 8px !important; right: 8px !important; bottom: 8px !important; width: auto !important; height: auto !important; }
  #winVar { left: 8px; right: 376px; bottom: 118px; height: 268px; }
  #winAgent { right: 8px; top: 8px; width: 360px; bottom: 150px; }
  .wtabs { display: flex; align-items: stretch; height: 27px; flex: none; background: #262626; cursor: move; touch-action: none; }
  .wtabs .t { font-variant: small-caps; font-size: 14.5px; letter-spacing: .03em; padding: 0 9px; border: 0; border-right: 1px solid #4a4a4a; background: none; color: #c8c8c8; display: flex; align-items: center; }
  .wtabs button.t { cursor: pointer; }
  .wtabs .t[aria-selected="true"], .wtabs span.t { background: var(--win); color: #fff; }
  .wctl { margin-left: auto; display: flex; }
  .wctl button { width: 30px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .wctl button:hover { background: #3a3a3a; }
  .wtools { display: flex; gap: 9px; align-items: center; padding: 0 8px; height: 36px; flex: none; }
  .wtools .sep { flex: 1; }
  .pane { flex: 1; overflow: auto; min-height: 0; margin: 0 4px; border: 1px solid #2f6fb5; background: #161616; }
  .pane[hidden] { display: none; }

  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .grid th { position: sticky; top: 0; z-index: 1; background: #1d1d1d; font-weight: 700; text-align: center; height: 25px; padding: 0 5px; border-bottom: 2px solid var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid th.pc { max-width: 66px; } .grid th.mc { max-width: 88px; }
  .grid td { background: #1c1c1c; height: 27px; padding: 0 5px; text-align: center; border-bottom: 1px solid #343434; white-space: nowrap; }
  .grid td small { display: block; color: #9db3d9; font-size: 10px; line-height: 10px; }
  .grid tr.pred td small { color: #8b8b8b; }
  .grid tr.pred td.m { background: #131a22; }
  .grid tr.ver td { background: var(--sel); }
  .grid tr.ver td.m { background: var(--navy); }
  .grid tr.fail.pred td.m { background: #2b171a; }
  .grid tr.fail.ver td.m { background: #4b1b27; }
  .grid tr.base td { background: #24425f; color: #c9d3de; font-style: italic; }
  .grid tr.base td.m { background: #172a4d; }
  .grid tr.base.fail td.m { background: #3b2030; }
  .grid tr.row { cursor: pointer; }
  .grid tr.row:hover td { filter: brightness(1.18); }
  .grid tr.sel td { box-shadow: inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
  .grid tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--blue), inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
  .grid tr.sel td:last-child { box-shadow: inset -2px 0 0 var(--blue), inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
  .grid tr.rec td.name { color: #8dff9a; font-weight: 700; }
  .grid tr.oor td.inr { color: var(--amber); font-weight: 700; }
  .grid tr.oor td.name { border-left: 3px solid var(--amber); }
  .grid td.num { font-weight: 700; }
  .yes { color: #7ee08a; } .no { color: var(--red); font-weight: 700; }
  .cb { display: inline-block; width: 14px; height: 14px; border: 1.5px solid #4f9ee8; background: #1c1c1c; vertical-align: middle; position: relative; }
  .cb.on { background: #2f8fef; border-color: #cfe6ff; }
  .cb.on::after { content: ""; position: absolute; left: 3.5px; top: 0; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(40deg); }
  .st { display: inline-block; width: 15px; height: 15px; border-radius: 50%; border: 1.6px solid var(--muted); vertical-align: middle; position: relative; }
  .st.solved { border-color: var(--green); }
  .st.solved::after { content: ""; position: absolute; left: 4px; top: 1.5px; width: 3px; height: 6px; border: solid var(--green); border-width: 0 1.6px 1.6px 0; transform: rotate(40deg); }
  .st.pending { border-color: var(--amber); }
  .st.pending::after { content: ""; position: absolute; left: 5px; top: 2px; width: 3px; height: 4px; border: solid var(--amber); border-width: 0 0 1.6px 1.6px; }
  .st.stopped { border-color: #e8e8e8; }
  .st.stopped::after { content: ""; position: absolute; left: 1.5px; top: 5px; width: 9px; height: 1.6px; background: #e8e8e8; transform: rotate(-45deg); }
  .st.solving { border-color: var(--green); border-right-color: transparent; transform: rotate(30deg); }
  .st.failed { border-color: var(--amber); }
  .st.failed::after { content: ""; position: absolute; left: 5px; top: 2px; width: 1.8px; height: 5px; background: var(--amber); box-shadow: 0 6.5px 0 -0.2px var(--amber); }
  .st.none { border: 0; border-radius: 0; height: 2px; width: 13px; background: var(--blue); }
  .st.info { border-color: #e8e8e8; }
  .st.info::after { content: "i"; position: absolute; inset: 0; font: 700 10px/12px Georgia, serif; text-align: center; color: #e8e8e8; }
  .star { color: var(--green); font-size: 15px; line-height: 1; } .star.on { color: #ffd84a; } .grid th .star { color: #fff; }
  .bfoot { display: flex; align-items: center; gap: 13px; padding: 0 10px; height: 34px; flex: none; white-space: nowrap; overflow: hidden; }
  .bfoot .cnt { display: inline-flex; align-items: center; gap: 4px; color: var(--blue); border-bottom: 2px solid #2a4f78; padding-bottom: 1px; }
  .bfoot .cnt .st { width: 13px; height: 13px; }
  .bfoot .cnt .st.none { height: 2px; }
  .bfoot .reset { display: inline-flex; align-items: center; gap: 4px; }
  .bfoot .feas { color: var(--muted); }
  .bfoot .right { margin-left: auto; display: flex; gap: 9px; align-items: center; }

  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 8px; border: 1px solid currentColor; line-height: 14px; white-space: nowrap; font-style: normal; text-shadow: none; }
  .chip.verified, .chip.recommended { color: #7ee08a; } .chip.predicted { color: var(--pred); } .chip.fake { color: var(--fake); border-style: dashed; } .chip.spec { color: var(--muted); }
  .grid tr.ver .chip.verified { background: #0d2a14; }

  /* Agent window */
  .wtools label { display: flex; gap: 6px; align-items: center; color: #d0d0d0; }
  .wtools select { background: #141414; border: 1px solid #2f7fd0; padding: 2px 4px; height: 24px; }
  .btn-run { background: var(--orange); color: #111; border: 0; height: 24px; padding: 0 14px; font-variant: small-caps; font-size: 15px; letter-spacing: .04em; cursor: pointer; clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%); }
  .btn-run:hover { filter: brightness(1.1); }
  .btn-run:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
  .log { flex: 1; overflow: auto; min-height: 0; margin: 0 4px 4px; border: 1px solid #2f6fb5; background: #161616; padding: 8px; display: flex; flex-direction: column; gap: 8px; user-select: text; }
  .msg { flex: none; max-width: 95%; padding: 6px 9px; background: #232323; border: 1px solid #3c3c3c; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--sel); border-color: #3f86cf; }
  .msg .who { display: flex; gap: 8px; align-items: center; font-variant: small-caps; font-size: 13px; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
  .msg.user .who { color: #cfe3f8; }
  .msg ul { margin: 3px 0 0; padding-left: 18px; }
  .msg .w { margin-top: 6px; padding: 3px 8px; border-left: 3px solid var(--amber); background: #33280d; color: var(--amber); }
  .msg .note { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .msg table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .msg td { padding: 1px 12px 1px 0; }
  .msg td small { color: var(--muted); }
  .empty { color: var(--muted); padding: 14px; }

  /* Agent window tabs: Graphs and Recommendations */
  .apane { flex: 1; overflow: auto; min-height: 0; margin: 0 4px 4px; border: 1px solid #2f6fb5; background: #161616; padding: 8px 9px; user-select: text; }
  .apane[hidden], .log[hidden] { display: none; }
  .apane p { margin: 0 0 6px; }
  .apane .goal { color: #f0efec; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px 12px; color: #c3c2b7; font-size: 12px; margin-bottom: 8px; }
  .key { display: inline-flex; align-items: center; gap: 4px; }
  .key .wash { width: 15px; height: 10px; background: rgba(217, 89, 38, .2); border-top: 1.2px dashed #c3c2b7; }
  .key .sw { width: 11px; height: 11px; border-radius: 2px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 18px; }
  .chart { margin: 0; max-width: 580px; }
  .chart figcaption { display: flex; flex-direction: column; margin-bottom: 3px; }
  .chart figcaption b { color: #f0efec; font-size: 13.5px; }
  .chart figcaption span { color: #898781; font-size: 12px; }
  .chart svg { display: block; width: 100%; height: auto; font-family: inherit; font-variant-numeric: tabular-nums; }
  .chart svg[data-ch] { cursor: crosshair; }
  .chart .legend { margin: 2px 0 2px; }
  .vnote, .mutedp { color: #898781; font-size: 12px; }
  .vnote { margin-top: 8px; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: #0d0d0d; border: 1px solid #4a4a46; padding: 6px 9px; font-size: 12.5px; min-width: 170px; box-shadow: 0 6px 18px #000c; }
  .tip[hidden] { display: none; }
  .tip b { display: block; color: #f0efec; }
  .tip .tsub { display: block; color: #898781; font-size: 11.5px; margin-bottom: 3px; }
  .tip div { display: flex; justify-content: space-between; gap: 16px; color: #c3c2b7; }
  .tip strong { color: #f0efec; font-variant-numeric: tabular-nums; }
  #recs > * { max-width: 760px; }
  #recs h3 { margin: 12px 0 5px; font-size: 14.5px; font-weight: 400; font-variant: small-caps; letter-spacing: .04em; color: #fff; border-bottom: 1px solid #2f6fb5; padding-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #recs h3:first-child { margin-top: 0; }
  #recs h4 { margin: 10px 0 4px; font-size: 13px; font-weight: 600; color: #c3c2b7; }
  #recs .acts { margin-left: auto; display: flex; gap: 10px; font-variant: normal; letter-spacing: 0; }
  .lnk { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-size: 12px; text-decoration: underline; }
  table.rt { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .rt th { text-align: right; font-weight: 600; color: #c3c2b7; border-bottom: 1px solid #4a4a46; padding: 2px 4px; white-space: nowrap; }
  .rt td { text-align: right; padding: 2px 4px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
  .rt th:first-child, .rt td:first-child { text-align: left; }
  .rt tr.bindrow td { background: #33280d; }
  .rt td.no { color: var(--red); }
  .eq { margin: 6px 0; padding: 5px 8px 7px; background: #1f1f1f; border-left: 3px solid #2f6fb5; overflow-x: auto; }
  .eq.bind { border-left-color: var(--amber); }
  .eq .cap { color: #a8a8a2; font-size: 12px; margin-bottom: 4px; }

// ---- Units: the contract carries mm and MPa, Discovery shows m and Pa. Conversion only, no other maths.
function sig(v, n = 3) {
  if (v === 0) return "0";
  const a = Math.abs(v);
  // Discovery switches to exponent form for very small and very large values.
  if (a < 1e-4 || a >= 1e6) return v.toExponential(n - 1).replace("e+", "e");
  return String(Number(v.toPrecision(n)));
}
const U = {
  mm: (v, n) => sig(v / 1000, n) + " m",
  mpa: (v) => sig(v * 1e6) + " Pa",
  kg: (v) => sig(v) + " kg",
  n: (v) => sig(v) + " N",
  sf: (v) => sig(v),
};
const metricText = (metric, v) => metric === "mass_kg" ? U.kg(v) : metric === "max_stress_mpa" ? U.mpa(v) : metric === "max_disp_mm" ? U.mm(v) : U.sf(v);

// ---- Validation against the field names in contracts/models.py. Missing fields are errors, never defaults.
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const isStr = (v) => typeof v === "string";
const isBool = (v) => typeof v === "boolean";
const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
function field(errs, obj, name, test, what, where) {
  if (!isObj(obj) || !(name in obj)) { errs.push(`${where}: missing field "${name}"`); return false; }
  if (!test(obj[name])) { errs.push(`${where}.${name}: expected ${what}`); return false; }
  return true;
}
function checkDesign(errs, d, where) {
  if (!isObj(d)) { errs.push(`${where}: expected an object of the five dimensions`); return; }
  for (const p of PARAMS) field(errs, d, p, isNum, "a number", where);
}
function checkSpec(errs, s, where) {
  if (!isObj(s)) { errs.push(`${where}: expected a StudySpec object`); return; }
  field(errs, s, "bracket_family", isStr, "a string", where);
  field(errs, s, "material_key", isStr, "a string", where);
  field(errs, s, "n_verify", isNum, "a number", where);
  if (field(errs, s, "objective", isObj, "an object", where)) {
    field(errs, s.objective, "metric", (v) => METRICS.includes(v), "a metric name", where + ".objective");
    field(errs, s.objective, "direction", isStr, "a string", where + ".objective");
  }
  if (field(errs, s, "constraints", Array.isArray, "a list", where)) s.constraints.forEach((c, i) => {
    const w = `${where}.constraints[${i}]`;
    field(errs, c, "metric", (v) => METRICS.includes(v), "a metric name", w);
    field(errs, c, "op", (v) => v === ">=" || v === "<=", '">=" or "<="', w);
    field(errs, c, "value", isNum, "a number", w);
  });
  if (field(errs, s, "parameters", Array.isArray, "a list", where)) s.parameters.forEach((p, i) => {
    const w = `${where}.parameters[${i}]`;
    field(errs, p, "name", (v) => PARAMS.includes(v), "a parameter name", w);
    field(errs, p, "low_mm", isNum, "a number", w);
    field(errs, p, "high_mm", isNum, "a number", w);
  });
  if (field(errs, s, "load", isObj, "an object", where)) {
    field(errs, s.load, "force_n", isNum, "a number", where + ".load");
    field(errs, s.load, "angle_deg", isNum, "a number", where + ".load");
  }
  field(errs, s, "assumptions", Array.isArray, "a list", where);
}
function checkEstimate(errs, c, name, where) {
  if (field(errs, c, name, isObj, "an Estimate object", where)) for (const k of ["value", "p05", "p95"]) field(errs, c[name], k, isNum, "a number", `${where}.${name}`);
}
function checkPrediction(errs, p, where) {
  if (!isObj(p)) { errs.push(`${where}: expected a Prediction object`); return; }
  field(errs, p, "model_name", isStr, "a string", where);
  field(errs, p, "trained_on_runs", isNum, "a number", where);
  field(errs, p, "warnings", Array.isArray, "a list", where);
  if (field(errs, p, "shortlist", Array.isArray, "a list", where)) p.shortlist.forEach((c, i) => {
    const w = `${where}.shortlist[${i}]`;
    field(errs, c, "design_id", isStr, "a string", w);
    if (isObj(c)) checkDesign(errs, c.design, w + ".design");
    field(errs, c, "mass_kg", isNum, "a number", w);
    for (const e of ["max_stress_mpa", "max_disp_mm", "safety_factor"]) checkEstimate(errs, c, e, w);
    field(errs, c, "feasible_p95", isBool, "true or false", w);
    field(errs, c, "in_training_range", isBool, "true or false", w);
  });
}
function checkVerified(errs, v, where) {
  if (!isObj(v)) { errs.push(`${where}: expected a Verified object`); return; }
  field(errs, v, "design_id", isStr, "a string", where);
  checkDesign(errs, v.design, where + ".design");
  field(errs, v, "source", isStr, "a string", where);
  for (const m of METRICS) field(errs, v, m, isNum, "a number", where);
  field(errs, v, "feasible", isBool, "true or false", where);
  field(errs, v, "violated", Array.isArray, "a list", where);
}
function checkResult(errs, r, where) {
  if (!isObj(r)) { errs.push(`${where}: expected a Result object`); return; }
  if (field(errs, r, "spec", isObj, "an object", where)) checkSpec(errs, r.spec, where + ".spec");
  if (field(errs, r, "baseline", isObj, "an object", where)) checkVerified(errs, r.baseline, where + ".baseline");
  // recommended must be present; null is the valid "nothing feasible" value.
  if (!("recommended" in r)) errs.push(`${where}: missing field "recommended"`);
  else if (r.recommended !== null) checkVerified(errs, r.recommended, where + ".recommended");
  if (field(errs, r, "finalists", Array.isArray, "a list", where)) r.finalists.forEach((f, i) => checkVerified(errs, f, `${where}.finalists[${i}]`));
  field(errs, r, "explanation", isStr, "a string", where);
  if (field(errs, r, "discovery_values", isObj, "an object", where)) checkDesign(errs, r.discovery_values, where + ".discovery_values");
  field(errs, r, "warnings", Array.isArray, "a list", where);
}

// ---- Loading: fetch first, file picker when the browser blocks file:// requests.
async function fetchJson(path) {
  let resp;
  try { resp = await fetch(path, { cache: "no-store" }); }
  catch (e) { const err = new Error(`${path}: could not be fetched`); err.blocked = true; throw err; }
  if (!resp.ok) throw new Error(`${path}: HTTP ${resp.status}`);
  const text = await resp.text();
  try { return JSON.parse(text); } catch (e) { throw new Error(`${path}: not valid JSON (${e.message})`); }
}
async function loadFixture(key) {
  S.run++; // cancels a demo that is still playing
  const sfx = key in SUFFIX ? SUFFIX[key] : "_" + key;
  const names = ["study_spec", "prediction", "result"].map((k) => `fixtures/${k}${sfx}.json`);
  try {
    const [spec, pred, res] = await Promise.all(names.map(fetchJson));
    accept(spec, pred, res, names);
  } catch (e) {
    clearAll();
    if (e.blocked && location.protocol === "file:") showBanner("Fixtures need a file picker", ["This page was opened from disk, and the browser blocks fetch on file:// pages. Pick the files below, or use the launcher at the top of the repo."], true);
    else showBanner("Could not load the fixture", [e.message], true);
  }
}
async function loadPicked(fileList) {
  const got = {}, errs = [], names = {};
  for (const f of fileList) {
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { errs.push(`${f.name}: not valid JSON (${e.message})`); continue; }
    // Tell the three files apart by their top-level contract fields.
    const kind = isObj(data) && "shortlist" in data ? "pred" : isObj(data) && "finalists" in data ? "res" : isObj(data) && "objective" in data ? "spec" : null;
    if (!kind) errs.push(`${f.name}: not a study_spec, prediction or result file`);
    else { got[kind] = data; names[kind] = f.name; }
  }
  for (const [k, label] of [["spec", "study_spec"], ["pred", "prediction"], ["res", "result"]]) if (!got[k]) errs.push(`no ${label} file selected`);
  S.run++;
  if (errs.length) { clearAll(); showBanner("Could not use the selected files", errs, true); return; }
  accept(got.spec, got.pred, got.res, [names.spec, names.pred, names.res]);
}
function accept(spec, pred, res, names) {
  const errs = [];
  checkSpec(errs, spec, names[0]);
  checkPrediction(errs, pred, names[1]);
  checkResult(errs, res, names[2]);
  if (errs.length) { clearAll(); showBanner("Fixture does not match the contract", errs, location.protocol === "file:"); return; }
  hideBanner();
  Object.assign(S, { spec, pred, res, sel: "baseline" });
  build(names);
  S.rows.forEach((r) => { r.show = r.ver ? "verified" : "predicted"; });
  S.shown = S.msgs.length; // static load shows the finished state; Run demo replays it
  document.body.dataset.demo = "idle";
  renderAll();
  $("loaded").textContent = `${names.join(", ")} | shown in m, Pa, N from contract mm, MPa`;
}
function showBanner(title, lines, withPicker) {
  $("bannerTitle").textContent = title;
  const more = lines.length > 8 ? `<li>and ${lines.length - 8} more</li>` : "";
  $("bannerBody").innerHTML = `<ul>${lines.slice(0, 8).map((l) => `<li>${esc(l)}</li>`).join("")}${more}</ul>`;
  $("pick").hidden = !withPicker;
  $("banner").hidden = false;
}
function hideBanner() { $("banner").hidden = true; }
function clearAll() {
  Object.assign(S, { spec: null, pred: null, res: null, rows: [], msgs: [], shown: 0, sel: "baseline" });
  document.body.dataset.demo = "idle";
  $("loaded").textContent = "No data loaded";
  renderAll();
}

// ---- Model: join shortlist candidates with verified finalists by design_id.
function build(names) {
  const { pred, res } = S;
  const cands = new Map(pred.shortlist.map((c, j) => [c.design_id, { c, j }]));
  const rows = [], seen = new Set();
  // Finalists first, in the agent's order, then the rest of the shortlist.
  res.finalists.forEach((v, i) => {
    const hit = cands.get(v.design_id);
    rows.push({ id: v.design_id, ver: v, verPath: `${names[2]} finalists[${i}]`, cand: hit ? hit.c : null, candPath: hit ? `${names[1]} shortlist[${hit.j}]` : null });
    seen.add(v.design_id);
  });
  pred.shortlist.forEach((c, j) => { if (!seen.has(c.design_id)) rows.push({ id: c.design_id, ver: null, cand: c, candPath: `${names[1]} shortlist[${j}]` }); });
  rows.forEach((r, k) => { r.n = k + 1; r.name = "DV" + (k + 1); r.isRec = !!res.recommended && res.recommended.design_id === r.id; r.show = "none"; });
  S.rows = rows;
  S.baseRow = { id: "baseline", name: "Baseline", ver: res.baseline, verPath: `${names[2]} baseline`, cand: null, show: "verified", isBase: true };
  S.msgs = buildMessages(names);
}
const isFake = (s) => /fake/i.test(s);
function buildMessages(names) {
  const { spec, pred, res } = S;
  const sp = res.spec; // the goal is the spec the result was computed for
  const cons = sp.constraints.map((c) => `${GOAL_WORD[c.metric]} ${c.op} ${c.value}${GOAL_UNIT[c.metric]}`).join(" and ");
  const dir = sp.objective.direction.charAt(0).toUpperCase() + sp.objective.direction.slice(1);
  const goal = `${dir} ${GOAL_WORD[sp.objective.metric]} of the ${sp.bracket_family} bracket in ${sp.material_key}. Keep ${cons}, under a ${sp.load.force_n} N load at ${sp.load.angle_deg} deg.`;
  // Chips come from what the data says about itself: model name, sources and warnings.
  const predChip = isFake(pred.model_name) || pred.warnings.some(isFake) ? "fake" : "predicted";
  const sources = [...new Set([...res.finalists.map((f) => f.source), res.baseline.source])];
  const verChip = sources.some(isFake) ? "fake" : "verified";
  const source = res.finalists.length ? res.finalists[0].source : res.baseline.source;
  const missing = res.finalists.filter((f) => !pred.shortlist.some((c) => c.design_id === f.design_id)).length;
  const out = pred.shortlist.filter((c) => !c.in_training_range).length;
  const recCand = res.recommended && pred.shortlist.find((c) => c.design_id === res.recommended.design_id);

  const msgs = [{ who: "user", text: goal }];
  if (JSON.stringify(spec) !== JSON.stringify(sp)) msgs[0].warns = [`${names[0]} differs from the spec inside ${names[2]}; the tree shows the first, the goal the second.`];
  msgs.push({ who: "agent", chip: "spec", text: sp.assumptions.length ? "Assumptions:" : "No assumptions recorded in the spec.", list: sp.assumptions });
  msgs.push({
    who: "agent", chip: predChip, action: "shortlist",
    text: `Shortlisting with ${pred.model_name}, trained on ${pred.trained_on_runs} runs`,
    warns: pred.warnings.filter((w) => !res.warnings.includes(w)).concat(out ? [`${out} of ${pred.shortlist.length} shortlisted rows have in_training_range false.`] : []),
  });
  msgs.push({
    who: "agent", chip: verChip, action: "verify",
    text: `Verifying ${sp.n_verify} finalists with ${source}`,
    note: missing ? `${missing} of ${res.finalists.length} finalists are not in the ${names[1]} shortlist, so those rows show solver values only.` : null,
  });
  const endWarns = res.warnings.slice();
  if (!res.recommended) endWarns.push("No design met every constraint, so there is no recommendation.");
  if (recCand && !recCand.in_training_range) endWarns.push("The recommended design is outside the training range; its prediction was extrapolated.");
  msgs.push({ who: "agent", chip: verChip, text: res.explanation, warns: endWarns });
  msgs.push({
    who: "agent", chip: verChip, text: res.recommended ? "Enter in Discovery:" : "Enter in Discovery (baseline fallback):", values: res.discovery_values,
    warns: res.recommended ? [] : ["These are the baseline values, not a recommendation."],
  });
  return msgs;
}

    + (s.objective.metric === m ? `<span class="vplain">${esc(s.objective.direction)}</span>` : "") || '<span class="vplain">monitor only</span>';
  // Mark the monitor named by result.binding_constraint.

  const node = (icon, label, val, cls = "", title = "") => `<li><div class="node${cls}" title="${esc(title)}">${ic(icon, 16)}<span>${esc(label)}</span>${val}</div></li>`;

const VIZ = { rec: "#3987e5", ok: "#199e70", fail: "#d95926", base: "#898781", pos: "#e66767", neg: "#3987e5", ink: "#f0efec", ink2: "#c3c2b7", muted: "#898781", grid: "#2c2c2a", axis: "#4a4a46", surface: "#161616" };
const UNIT_K = { mass_kg: 1, max_stress_mpa: 1e6, max_disp_mm: 1e-3, safety_factor: 1 }; // contract unit to display unit
const AXIS_LABEL = { mass_kg: "Mass (kg)", max_stress_mpa: "Max. Von Mises Stress (Pa)", max_disp_mm: "Max. Displacement (m)", safety_factor: "Factor of Safety" };
const SHORT_LABEL = { mass_kg: "Mass", max_stress_mpa: "Von Mises stress", max_disp_mm: "Displacement", safety_factor: "Factor of safety" };

}
// Value of one monitor for one row in display units: solver number, or estimate with its band.
function rowVal(r, metric) {

}
const rowFeasible = (r) => isVerified(r) ? r.ver.feasible : r.cand.feasible_p95;
const rowKind = (r) => r.isBase ? "base" : r.isRec && isVerified(r) ? "rec" : rowFeasible(r) ? "ok" : "fail";

  let s = "";
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; s += `${(cx + q * Math.cos(a)).toFixed(1)},${(cy + q * Math.sin(a)).toFixed(1)} `; }

}
// Marker per state: star, circle, cross, diamond. Filled or heavy means verified, hollow or thin means predicted.
function mark(kind, x, y, solid) {
  const c = VIZ[kind], ring = `stroke="${VIZ.surface}" stroke-width="3.5" paint-order="stroke"`;
  if (kind === "fail") {
    const d = `M${x - 4} ${y - 4}L${x + 4} ${y + 4}M${x + 4} ${y - 4}L${x - 4} ${y + 4}`;
    return `<path d="${d}" stroke="${VIZ.surface}" stroke-width="${solid ? 5.5 : 4}" stroke-linecap="round"/><path d="${d}" stroke="${c}" stroke-width="${solid ? 2.7 : 1.4}" stroke-linecap="round"/>`;
  }

const figure = (title, sub, svg) => `<figure class="chart"><figcaption><b>${title}</b><span>${sub}</span></figcaption>${svg}</figure>`;
const tipAttr = (t) => `data-tip="${esc(JSON.stringify(t))}"`;

// One monitor against the objective, with the requirement line and the region that fails it.
function scatterChart(metric, rows, idx, bind) {
  const sp = S.res.spec, obj = sp.objective.metric, W = 340, H = 238, m = { l: 50, r: 14, t: 22, b: 40 };
  const cons = sp.constraints.filter((c) => c.metric === metric);
  const pts = rows.map((r) => { const y = rowVal(r, metric); return { r, kind: rowKind(r), solid: isVerified(r), x: rowVal(r, obj).v, y: y.v, lo: y.lo, hi: y.hi }; });
  const span = (vals) => { const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo || Math.abs(hi) || 1) * 0.09; return [lo >= 0 ? Math.max(0, lo - pad) : lo - pad, hi + pad]; };
  const [x0, x1] = span(pts.map((p) => p.x));
  // The y range always includes the requirement, so the gap to it is visible.
  const [y0, y1] = span(pts.flatMap((p) => p.lo === undefined ? [p.y] : [p.y, p.lo, p.hi]).concat(cons.map((c) => c.value * UNIT_K[metric])));
  const X = (v) => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = (v) => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  let g = "", lim = "", whisk = "", marks = "", labels = "";
  for (const t of niceTicks(y0, y1, 4)) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${VIZ.grid}"/><text x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end">${tickFmt(t)}</text>`;
  for (const t of niceTicks(x0, x1, 4)) g += `<line x1="${X(t)}" x2="${X(t)}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="${VIZ.axis}"/><text x="${X(t)}" y="${H - m.b + 15}" text-anchor="middle">${tickFmt(t)}</text>`;
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="${VIZ.axis}"/>`;
  const taken = []; // label boxes already placed, so later labels steer clear
  for (const c of cons) {
    const y = Y(c.value * UNIT_K[metric]), below = c.op === ">=", room = below ? H - m.b - y : y - m.t;
    // The label sits on the failing side of the line when there is room, where few points are.
    const text = `requirement ${opSym(c.op)} ${metricText(metric, c.value)}`, ly = (below ? room >= 15 : room < 15) ? y + 12 : y - 5;
    taken.push({ x: m.l + 4, y: ly - 11, w: text.length * 5.4, h: 13 }, { x: m.l, y: y - 3, w: W, h: 6 });
    lim += `<rect x="${m.l}" y="${below ? y : m.t}" width="${W - m.l - m.r}" height="${Math.max(0, room)}" fill="${VIZ.fail}" opacity=".1"/>
      <line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="${VIZ.ink2}" stroke-width="1.2" stroke-dasharray="5 3"/>
      <text x="${m.l + 4}" y="${ly}" fill="${VIZ.ink2}">${text}</text>`;
  }
  const order = { fail: 0, ok: 1, base: 2, rec: 3 };
  for (const p of pts) { p.px = X(p.x); p.py = Y(p.y); }
  // Try eight spots around the point and keep the one covering the fewest marks and labels.
  const place = (p, text) => {
    const w = text.length * 6 + 4, h = 12;
    let best = null;
    for (const [dx, dy, anchor] of [[12, 4, "start"], [-12, 4, "end"], [9, -10, "start"], [9, 19, "start"], [-9, -10, "end"], [-9, 19, "end"], [0, -14, "middle"], [0, 23, "middle"]]) {
      const x = p.px + dx, y = p.py + dy, xa = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
      const outside = xa < m.l || xa + w > W - 2 || y - h < 2 || y > H - m.b ? 50 : 0;
      const marksHit = pts.filter((q) => q !== p && q.px > xa - 5 && q.px < xa + w + 5 && q.py > y - h - 4 && q.py < y + 5).length;
      const labelsHit = taken.filter((b) => xa < b.x + b.w && xa + w > b.x && y - h < b.y + b.h && y > b.y).length;
      const score = outside + marksHit + labelsHit * 4;

    }
    taken.push(best.box);
    return best;

    if (p.lo !== undefined) whisk += `<line x1="${p.px}" x2="${p.px}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" stroke="${VIZ[p.kind]}" stroke-opacity=".5"/>`;

  }
  // Direct labels only for the points the story is about.

    const text = p.kind === "rec" ? `${p.r.name} recommended` : p.kind === "base" ? "Baseline" : p.r.id === S.sel ? p.r.name : "";
    if (!text) continue;
    const at = place(p, text);

  }

    ${g}${lim}${whisk}${marks}${labels}
    <text x="4" y="12" fill="${VIZ.ink2}">${AXIS_LABEL[metric]}</text><text x="${W - m.r}" y="${H - 7}" text-anchor="end" fill="${VIZ.ink2}">${AXIS_LABEL[obj]}, ${better}</text>
    <circle class="hl" r="10.5" fill="none" stroke="#fff" stroke-width="1.6" visibility="hidden"/></svg>`;
  const sub = cons.length ? `Requirement ${cons.map((c) => `${opSym(c.op)} ${metricText(metric, c.value)}`).join(", ")}${metric === bind ? ", the binding constraint" : ""}` : "No direct limit in the spec; it is governed through the other requirements";

}

  const refV = rec || res.finalists[0] || null, refRow = refV ? S.rows.find((r) => r.id === refV.design_id) : null, refName = refRow ? refRow.name : "";

  const need = (m) => sp.constraints.filter((c) => c.metric === m).map((c) => `${opSym(c.op)} ${metricText(m, c.value)}`).concat(sp.objective.metric === m ? [sp.objective.direction] : []).join(", ");
  const bad = (m, v) => v.violated.some((s) => s.startsWith(m + " "));
  const refHead = rec ? refName : refName ? refName + " (top finalist)" : "";
  const monitors = `<table class="rt"><thead><tr><th>Monitor</th><th>Requirement</th><th>Baseline</th>${refV ? `<th>${esc(refHead)}</th>` : ""}</tr></thead><tbody>${METRICS.map((m) =>
    `<tr${m === bindMetric ? ' class="bindrow"' : ""}><td>${SHORT_LABEL[m]}</td><td>${need(m)}</td><td class="${bad(m, base) ? "no" : ""}">${metricText(m, base[m])}</td>${refV ? `<td class="${bad(m, refV) ? "no" : ""}">${metricText(m, refV[m])}</td>` : ""}</tr>`).join("")}</tbody></table>`;
  const dims = refV ? `<table class="rt"><thead><tr><th>Dimension</th><th>Baseline</th><th>${esc(refName)}</th><th>Move</th></tr></thead><tbody>${PARAMS.map((p) => {
    const a = base.design[p], b = refV.design[p];
    return `<tr><td>${PARAM_LABEL[p]}</td><td>${U.mm(a)}</td><td>${U.mm(b)}</td><td>${b > a ? "▲ increase" : b < a ? "▼ decrease" : "keep"}</td></tr>`;
  }).join("")}</tbody></table>` : "";
  const mech = mechanics(sp, bindMetric);
  S.tex = mech.eqs.concat(mech.derived).map((e) => e.tex);
  const eqHtml = (e) => `<div class="eq${e.bind ? " bind" : ""}"><div class="cap">${esc(e.cap)}${e.bind ? ' <span class="chip bindchip">binding</span>' : ""}</div>${e.ml.map((m) => `<math display="block">${m}</math>`).join("")}<code>${esc(e.tex)}</code></div>`;
  const steps = avenues(refV, refName);
  el.innerHTML = `
    <h3>${rec ? `Recommended design ${esc(refName)}` : "No feasible design"} ${rec ? chip("recommended") : ""}</h3>
    <p>${esc(res.explanation)}</p>
    ${monitors}${dims}
    ${res.binding_constraint ? `<p class="mutedp">Highlighted row: the binding constraint, ${esc(res.binding_constraint)}.</p>` : ""}
    <h3>Mechanics behind the optimum <span class="acts"><button type="button" class="lnk" data-act="tex">LaTeX source</button><button type="button" class="lnk" data-act="copytex">Copy LaTeX</button></span></h3>
    <p class="mutedp">First-order beam model, the closed form used by the fake predictor and solver in contracts/fakes.py. The trained model and the solver supply the numbers; these relations explain which way each dimension has to move.</p>
    ${mech.eqs.map(eqHtml).join("")}
    ${mech.derived.length ? `<h4>From the requirements to the optimum</h4>${mech.derived.map(eqHtml).join("")}` : ""}
    <table class="where"><tbody>${mech.where.map(([s, d]) => `<tr><td>${s}</td><td>${esc(d)}</td></tr>`).join("")}</tbody></table>
    <h3>Avenues for the next iteration</h3>
    <ol class="steps">${steps.map(([h, t]) => `<li><b>${esc(h)}.</b> ${esc(t)}</li>`).join("")}</ol>`;
}
function showATab(tab) {
  for (const b of document.querySelectorAll("#winAgent .wtabs .t")) b.setAttribute("aria-selected", String(b.dataset.atab === tab));
  $("log").hidden = tab !== "chat"; $("graphs").hidden = tab !== "graphs"; $("recs").hidden = tab !== "recs";
  hideTip();
  if (tab === "graphs") renderGraphs();
  if (tab === "recs") renderRecs();
  if (tab === "chat") $("log").scrollTop = $("log").scrollHeight;
}
async function copyTex(btn) {
  const text = (S.tex || []).join("\n");
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) { $("recs").classList.add("show-tex"); btn.textContent = "Shown below"; } // clipboard blocked: reveal the source instead
  setTimeout(() => { btn.textContent = "Copy LaTeX"; }, 1600);
}

// ---- Scene: the L-plate extruded by thickness, drawn with a small perspective camera.
const VIEW = { yaw: -0.5, pitch: 0.34, dist: 620, cx: 50, cy: 26, floor: -13 };
function camera() {
  const cy = Math.cos(VIEW.yaw), sy = Math.sin(VIEW.yaw), cp = Math.cos(VIEW.pitch), sp = Math.sin(VIEW.pitch);
  // Yaw about the vertical axis, then pitch toward the viewer.
  const rot = (x, y, z) => { const x1 = x * cy + z * sy, z1 = -x * sy + z * cy; return [x1, y * cp - z1 * sp, y * sp + z1 * cp]; };
  const pt = (x, y, z) => { const [a, b, c] = rot(x - VIEW.cx, y - VIEW.cy, z); const k = VIEW.dist / (VIEW.dist - c); return [a * k, -b * k, c]; };
  return { rot, pt };
}
const poly = (pts) => pts.map((p) => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
function renderScene() {
  const box = $("scenebox"), r = S.res ? rowById(S.sel) || S.baseRow : null;
  if (!r) { box.innerHTML = ""; return; }
  const { rot, pt } = camera();
  const d = (r.ver || r.cand).design, load = S.res.spec.load;
  const t = d.thickness_mm, L = d.flange_length_mm, w = d.arm_width_mm, hole = d.hole_diameter_mm;
  const H = MOUNT_HEIGHT_MM, rad = Math.max(0, Math.min(d.fillet_radius_mm, H - w, L - w)); // clamp so the arc always fits
  // Profile in mm, counter-clockwise with y up; the fillet arc runs from the arm to the leg.
  const prof = [[0, 0], [L, 0], [L, w]];
  for (let i = 0; i <= 12; i++) { const a = Math.PI * (1.5 - 0.5 * i / 12); prof.push([w + rad + rad * Math.cos(a), w + rad + rad * Math.sin(a)]); }
  prof.push([w, H], [0, H]);
  // Side faces: keep the ones whose normal turns toward the camera, shade by a fixed light.
  const sides = [];
  prof.forEach((p, i) => {
    const q = prof[(i + 1) % prof.length], dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy);
    if (len < 1e-6) return;
    const nx = dy / len, ny = -dx / len;
    if (rot(nx, ny, 0)[2] <= 0) return;
    const shade = 0.5 + 0.48 * Math.max(0, nx * 0.25 + ny * 0.97);
    const quad = [pt(p[0], p[1], 0), pt(q[0], q[1], 0), pt(q[0], q[1], -t), pt(p[0], p[1], -t)];
    sides.push({ quad, z: quad.reduce((s, v) => s + v[2], 0) / 4, col: `rgb(${Math.round(196 * shade)},${Math.round(204 * shade)},${Math.round(214 * shade)})` });
  });
  sides.sort((a, b) => a.z - b.z); // far faces first
  const front = prof.map((p) => pt(p[0], p[1], 0));
  const hx = L - w / 2, hy = w / 2, hr = hole / 2; // hole centred across the arm near the free end
  const ring = (z) => Array.from({ length: 32 }, (_, i) => pt(hx + hr * Math.cos(i * Math.PI / 16), hy + hr * Math.sin(i * Math.PI / 16), z));
  // Floor grid with the two in-plane axes, like an empty modelling scene.
  let grid = "";
  const seg = (a, b) => `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
  for (let x = -90; x <= 190; x += 10) grid += seg(pt(x, VIEW.floor, -130), pt(x, VIEW.floor, 110));
  for (let z = -130; z <= 110; z += 10) grid += seg(pt(-90, VIEW.floor, z), pt(190, VIEW.floor, z));
  const fc = pt(VIEW.cx, VIEW.floor, -10);
  // Force arrow follows load.angle_deg; -90 points straight down onto the hole.
  const a = load.angle_deg * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
  const tip = pt(hx - ux * (hr + 1.5), hy - uy * (hr + 1.5), 0), tail = pt(hx - ux * (hr + 27), hy - uy * (hr + 27), 0);
  const al = Math.hypot(tip[0] - tail[0], tip[1] - tail[1]) || 1, vx = (tip[0] - tail[0]) / al, vy = (tip[1] - tail[1]) / al;
  let hatch = "";
  for (let y = 0; y <= H; y += 6) hatch += seg(pt(0, y, 0), pt(-5, y - 4, 0));
  const hot = r.isRec && isVerified(r);
  const f = pt(w + rad * 0.29, w + rad * 0.29, 0); // midpoint of the fillet arc
  box.innerHTML = `<svg viewBox="-72 -52 184 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="L-bracket for ${esc(r.name)}">
    <defs>
      <clipPath id="face"><polygon points="${poly(front)}"/></clipPath>
      <clipPath id="bore"><polygon points="${poly(ring(0))}"/></clipPath>
      <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3bcc7"/><stop offset="1" stop-color="#7f8994"/></linearGradient>
      <radialGradient id="hotspot"><stop offset="0" stop-color="#ff5a2c" stop-opacity=".95"/><stop offset=".45" stop-color="#f2a531" stop-opacity=".55"/><stop offset="1" stop-color="#f2a531" stop-opacity="0"/></radialGradient>
      <radialGradient id="fade"><stop offset=".25" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
      <mask id="floorMask"><ellipse cx="${fc[0]}" cy="${fc[1]}" rx="150" ry="62" fill="url(#fade)"/></mask>
    </defs>
    <g mask="url(#floorMask)">
      <g stroke="#6a6a6a" stroke-width=".22">${grid}</g>
      <g stroke-width=".55"><g stroke="#e5463c">${seg(pt(-90, VIEW.floor, 0), pt(190, VIEW.floor, 0))}</g><g stroke="#3ccf4e">${seg(pt(0, VIEW.floor, -130), pt(0, VIEW.floor, 110))}</g></g>
    </g>
    <polygon points="${poly(prof.map((p) => pt(p[0], p[1], -t)))}" fill="#3f454c"/>
    ${sides.map((s) => `<polygon points="${poly(s.quad)}" fill="${s.col}" stroke="${s.col}" stroke-width=".25"/>`).join("")}
    <polygon points="${poly(front)}" fill="url(#steel)" stroke="#d5dce4" stroke-width=".35" stroke-linejoin="round"/>
    ${hot ? `<circle cx="${f[0]}" cy="${f[1]}" r="${Math.max(rad, 5) * 1.9}" fill="url(#hotspot)" clip-path="url(#face)"/>` : ""}
    <polygon points="${poly(ring(0))}" fill="#555d67"/>
    <polygon points="${poly(ring(-t))}" fill="#222" clip-path="url(#bore)"/>
    <polygon points="${poly(ring(0))}" fill="none" stroke="#d5dce4" stroke-width=".35"/>
    <g stroke="${PU}" stroke-width=".6">${hatch}</g><g stroke="${PU}" stroke-width="1.1">${seg(pt(0, 0, 0), pt(0, H, 0))}</g>
    <g stroke="${PU}" fill="${PU}">
      <line x1="${tail[0]}" y1="${tail[1]}" x2="${tip[0] - vx * 4}" y2="${tip[1] - vy * 4}" stroke-width="1.3"/>
      <polygon stroke="none" points="${tip[0]},${tip[1]} ${tip[0] - vx * 6.5 - vy * 2.7},${tip[1] - vy * 6.5 + vx * 2.7} ${tip[0] - vx * 6.5 + vy * 2.7},${tip[1] - vy * 6.5 - vx * 2.7}"/>
    </g>
    <text x="${tail[0] + 2.5}" y="${tail[1] + 3}" fill="#e9d3f7" font-size="3.9">${U.n(load.force_n)}</text>
    ${hot ? `<line x1="${f[0] + 2}" y1="${f[1] - 2}" x2="${f[0] + 17}" y2="${f[1] - 19}" stroke="#ff9a5c" stroke-width=".35"/><text x="${f[0] + 18}" y="${f[1] - 20}" fill="#ffb07a" font-size="3.7">stress hotspot at the fillet (illustrative)</text>` : ""}
  </svg>`;
}

// ---- Interaction
function select(id, focus) {
  S.sel = id;
  renderTable(); renderParams(); renderScene(); renderReadout();
  if (focus) { const tr = $("pane-variations").querySelector("tr.sel"); if (tr) tr.focus(); }
}
let zTop = 5;
const front = (win) => { win.style.zIndex = ++zTop; };
function showWin(id, on) {
  const win = $(id);
  win.hidden = !on;
  $("vp").classList.toggle(id === "winAgent" ? "agent-off" : "var-off", !on);
  if (on) front(win);
}
function showTab(tab) {
  S.tab = tab;
  showWin("winVar", true);
  for (const b of document.querySelectorAll("#winVar .wtabs .t")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  for (const k of ["parameters", "testcases", "variations"]) $("pane-" + k).hidden = k !== tab;
}
// Windows drag by their tab bar and stay inside the viewport.
function draggable(win) {
  const bar = win.querySelector(".wtabs");
  win.addEventListener("pointerdown", () => front(win));
  bar.addEventListener("dblclick", (e) => { if (!e.target.closest("button")) win.classList.toggle("max"); });
  bar.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button") || win.classList.contains("max")) return;
    const vp = $("vp").getBoundingClientRect(), r = win.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
    // Switch from the CSS anchors to explicit left and top so the box can move freely.
    Object.assign(win.style, { left: r.left - vp.left + "px", top: r.top - vp.top + "px", right: "auto", bottom: "auto", width: r.width + "px", height: r.height + "px" });
    bar.setPointerCapture(e.pointerId);
    const move = (ev) => {
      win.style.left = Math.max(60 - r.width, Math.min(vp.width - 60, ev.clientX - vp.left - ox)) + "px";
      win.style.top = Math.max(0, Math.min(vp.height - 27, ev.clientY - vp.top - oy)) + "px";
    };
    const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up); };
    bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
  });
}
$("pane-variations").addEventListener("click", (e) => { const tr = e.target.closest("tr.row"); if (tr) select(tr.dataset.id, true); });
$("pane-variations").addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr.row"); if (!tr) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.id, true); }
  // Arrow keys walk the rows, so Tab leaves the table in one step.
  const next = e.key === "ArrowDown" ? tr.nextElementSibling : e.key === "ArrowUp" ? tr.previousElementSibling : null;
  if (next) { e.preventDefault(); select(next.dataset.id, true); }
});
document.addEventListener("click", (e) => {
  const menu = $("structMenu"), btn = e.target.closest("#structBtn");
  if (btn && menu.hidden) {
    // The menu lives outside the ribbon so the ribbon's clipping cannot cut it off.
    const r = btn.getBoundingClientRect();
    Object.assign(menu.style, { left: r.left + "px", top: r.bottom + "px" });
    menu.hidden = false; btn.classList.add("open");
  } else { menu.hidden = true; const b = $("structBtn"); if (b) b.classList.remove("open"); }
  const t = e.target.closest("[data-tab]"); if (t) showTab(t.dataset.tab);
  const c = e.target.closest("[data-close]"); if (c) showWin(c.dataset.close, false);
  const m = e.target.closest("[data-max]"); if (m) $(m.dataset.max).classList.toggle("max");
  const a = e.target.closest("[data-atab]"); if (a) showATab(a.dataset.atab);
  const act = e.target.closest("[data-act]");
  if (act && act.dataset.act === "tex") $("recs").classList.toggle("show-tex");
  if (act && act.dataset.act === "copytex") copyTex(act);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("structMenu").hidden = true; });
$("handle").addEventListener("click", () => showWin("winAgent", $("winAgent").hidden));
$("chevL").addEventListener("click", () => { $("groups").scrollLeft -= 320; });
$("chevR").addEventListener("click", () => { $("groups").scrollLeft += 320; });
$("fixture").addEventListener("change", (e) => loadFixture(e.target.value));
$("files").addEventListener("change", (e) => loadPicked(e.target.files));
$("run").addEventListener("click", runDemo);

// Plays the chat one message per step and fills the table as the matching step runs.
async function runDemo() {
  if (!S.res) return;
  const token = ++S.run;
  const wait = (ms) => new Promise((ok, stop) => setTimeout(() => token === S.run ? ok() : stop("cancelled"), ms));
  try {
    document.body.dataset.demo = "running";
    showWin("winAgent", true); showTab("variations"); showATab("chat");
    S.rows.forEach((r) => { r.show = "none"; });
    S.shown = 0; S.sel = "baseline";
    renderAll();
    $("pane-variations").scrollTop = 0;
    for (let i = 0; i < S.msgs.length; i++) {
      await wait(STEP_MS);
      S.shown = i + 1; renderChat();
      const m = S.msgs[i];
      if (m.action === "shortlist") for (const r of S.rows) if (r.cand) { r.show = "predicted"; renderTable(); await wait(70); }
      if (m.action === "verify") for (const r of S.rows) if (r.ver) { r.show = "verified"; renderTable(); await wait(220); }
    }
    const rec = S.rows.find((r) => r.isRec);
    if (rec) select(rec.id); else { renderScene(); renderReadout(); }
    document.body.dataset.demo = "done";
  } catch (e) { if (e !== "cancelled") throw e; }
}

buildChrome();
draggable($("winVar")); draggable($("winAgent"));
// ?fixture=name picks the starting fixture, which also makes the error path easy to show.
const start = new URLSearchParams(location.search).get("fixture") || "normal";
if (start in SUFFIX) $("fixture").value = start;
loadFixture(start);
</script>
